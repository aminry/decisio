<title id="t">Calibration on held-out questions</title>
<desc id="d">Reliability curves: accuracy against stated confidence in ten bins. A calibrated model lies on the diagonal. Expected calibration error, in percentage points: Decisio v3 2.3, previous Decisio 12B 3.6, base Gemma 4 12B 9.0.</desc>
