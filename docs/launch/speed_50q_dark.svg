<text x="926.9" y="332.0" font-size="13" font-weight="600" fill="#ffffff">48.9 s</text>
<text x="28" y="436" font-size="15" font-weight="600" fill="#ffffff">A document of 6,000 tokens</text>
<line x1="250.0" y1="452" x2="250.0" y2="632" stroke="#2e2e2c" stroke-width="1"/>
<text x="250.0" y="650" font-size="11" text-anchor="middle" fill="#8f8e86">0 s</text>
<line x1="367.1" y1="452" x2="367.1" y2="632" stroke="#2e2e2c" stroke-width="1"/>
<text x="367.1" y="650" font-size="11" text-anchor="middle" fill="#8f8e86">20 s</text>
<line x1="484.3" y1="452" x2="484.3" y2="632" stroke="#2e2e2c" stroke-width="1"/>
<text x="484.3" y="650" font-size="11" text-anchor="middle" fill="#8f8e86">40 s</text>
<line x1="601.4" y1="452" x2="601.4" y2="632" stroke="#2e2e2c" stroke-width="1"/>
<text x="601.4" y="650" font-size="11" text-anchor="middle" fill="#8f8e86">60 s</text>
<line x1="718.6" y1="452" x2="718.6" y2="632" stroke="#2e2e2c" stroke-width="1"/>
<text x="718.6" y="650" font-size="11" text-anchor="middle" fill="#8f8e86">80 s</text>
<line x1="835.7" y1="452" x2="835.7" y2="632" stroke="#2e2e2c" stroke-width="1"/>
<text x="835.7" y="650" font-size="11" text-anchor="middle" fill="#8f8e86">100 s</text>
<line x1="952.9" y1="452" x2="952.9" y2="632" stroke="#2e2e2c" stroke-width="1"/>
<text x="952.9" y="650" font-size="11" text-anchor="middle" fill="#8f8e86">120 s</text>
<line x1="1070.0" y1="452" x2="1070.0" y2="632" stroke="#2e2e2c" stroke-width="1"/>
<text x="1070.0" y="650" font-size="11" text-anchor="middle" fill="#8f8e86">140 s</text>
<line x1="250" y1="452" x2="250" y2="632" stroke="#4a4a47" stroke-width="1"/>
<text x="228" y="474.0" font-size="13" text-anchor="end" fill="#ffffff">decisio Gemma 4 31B</text>
<g><title>decisio Gemma 4 31B: 1.73 s for 50 questions about one 6,000-token document (median of 10 documents)</title><rect x="250" y="460.0" width="10.2" height="20" rx="2" fill="#3987e5"/></g>
<text x="268.2" y="474.0" font-size="13" font-weight="600" fill="#ffffff">1.73 s</text>
<text x="228" y="510.0" font-size="13" text-anchor="end" fill="#ffffff">decisio Gemma 4 12B</text>
<g><title>decisio Gemma 4 12B: 1.97 s for 50 questions about one 6,000-token document (median of 10 documents)</title><rect x="250" y="496.0" width="11.6" height="20" rx="2" fill="#3987e5"/></g>
<text x="269.6" y="510.0" font-size="13" font-weight="600" fill="#ffffff">1.97 s</text>
<text x="228" y="546.0" font-size="13" text-anchor="end" fill="#ffffff">H2O-Lightning-4B v1.1</text>
<g><title>H2O-Lightning-4B v1.1: 2.82 s for 50 questions about one 6,000-token document (median of 10 documents)</title><rect x="250" y="532.0" width="16.5" height="20" rx="2" fill="#199e70"/></g>
<text x="274.5" y="546.0" font-size="13" font-weight="600" fill="#ffffff">2.82 s</text>
<text x="228" y="582.0" font-size="13" text-anchor="end" fill="#ffffff">Jeff-1.0-Large</text>
<g><title>Jeff-1.0-Large: 114.6 s for 50 questions about one 6,000-token document (median of 5 documents)</title><rect x="250" y="568.0" width="671.0" height="20" rx="2" fill="#d95926"/></g>
<text x="929.0" y="582.0" font-size="13" font-weight="600" fill="#ffffff">114.6 s</text>
<text x="228" y="618.0" font-size="13" text-anchor="end" fill="#ffffff">Quyet-1.0-Large</text>
<g><title>Quyet-1.0-Large: 114.8 s for 50 questions about one 6,000-token document (median of 5 documents)</title><rect x="250" y="604.0" width="672.3" height="20" rx="2" fill="#d95926"/></g>
<text x="930.3" y="618.0" font-size="13" font-weight="600" fill="#ffffff">114.8 s</text>
<text x="28" y="722" font-size="15" font-weight="600" fill="#ffffff">A document of 32,000 tokens: which systems answer</text>
<line x1="250.0" y1="738" x2="250.0" y2="918" stroke="#2e2e2c" stroke-width="1"/>
<text x="250.0" y="936" font-size="11" text-anchor="middle" fill="#8f8e86">0 s</text>
<line x1="523.3" y1="738" x2="523.3" y2="918" stroke="#2e2e2c" stroke-width="1"/>
<text x="523.3" y="936" font-size="11" text-anchor="middle" fill="#8f8e86">5 s</text>
<line x1="796.7" y1="738" x2="796.7" y2="918" stroke="#2e2e2c" stroke-width="1"/>
<text x="796.7" y="936" font-size="11" text-anchor="middle" fill="#8f8e86">10 s</text>
<line x1="1070.0" y1="738" x2="1070.0" y2="918" stroke="#2e2e2c" stroke-width="1"/>
<text x="1070.0" y="936" font-size="11" text-anchor="middle" fill="#8f8e86">15 s</text>
<line x1="250" y1="738" x2="250" y2="918" stroke="#4a4a47" stroke-width="1"/>
<text x="228" y="760.0" font-size="13" text-anchor="end" fill="#ffffff">decisio Gemma 4 12B</text>
<g><title>decisio Gemma 4 12B: 6.76 s for 50 questions about one 32,000-token document (median of 5 documents)</title><rect x="250" y="746.0" width="369.5" height="20" rx="2" fill="#3987e5"/></g>
<text x="627.5" y="760.0" font-size="13" font-weight="600" fill="#ffffff">6.76 s</text>
<text x="228" y="796.0" font-size="13" text-anchor="end" fill="#ffffff">H2O-Lightning-4B v1.1</text>
<g><title>H2O-Lightning-4B v1.1: 9.05 s for 50 questions about one 32,000-token document (median of 5 documents)</title><rect x="250" y="782.0" width="495.0" height="20" rx="2" fill="#199e70"/></g>
<text x="753.0" y="796.0" font-size="13" font-weight="600" fill="#ffffff">9.05 s</text>
<text x="228" y="832.0" font-size="13" text-anchor="end" fill="#ffffff">decisio Gemma 4 31B</text>
<g><title>decisio Gemma 4 31B: 10.1 s for 50 questions about one 32,000-token document (median of 5 documents)</title><rect x="250" y="818.0" width="550.4" height="20" rx="2" fill="#3987e5"/></g>
<text x="808.4" y="832.0" font-size="13" font-weight="600" fill="#ffffff">10.1 s</text>
<text x="228" y="868.0" font-size="13" text-anchor="end" fill="#ffffff">Jeff-1.0-Large</text>
<text x="258" y="868.0" font-size="12" font-style="italic" fill="#8f8e86">not supported: over its 8,192-token limit</text>
<text x="228" y="904.0" font-size="13" text-anchor="end" fill="#ffffff">Quyet-1.0-Large</text>
<text x="258" y="904.0" font-size="12" font-style="italic" fill="#8f8e86">not supported: over its 6,000-token limit</text>
<text x="28" y="1002" font-size="12" fill="#c3c2b7">All five ran in one session on one box: an RTX PRO 6000 at 600 W (AMD EPYC 9374F), each on its own server.</text>
<text x="28" y="1020" font-size="12" fill="#c3c2b7">SM clock p50 and power p50 of each system&#x27;s run: decisio 31B 2,220 MHz at 592 W; decisio 12B 2,374 MHz at 563 W; H2O 2,610 MHz at 304 W; Jeff 2,317 MHz at 600 W; Quyet 2,325 MHz at 600 W.</text>
<text x="28" y="1038" font-size="12" fill="#c3c2b7">A bar is the median wall time to answer 50 questions about one document: one request that carries them, or, for H2O-Lightning-4B, 50 requests in a row.</text>
<text x="28" y="1056" font-size="12" fill="#c3c2b7">Medians over 5 or 10 documents per bar. A state is never cut: a system whose limit is below the document is marked not supported.</text>
</svg>