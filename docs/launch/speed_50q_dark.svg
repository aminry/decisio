<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1120" width="1240" height="1120" role="img" aria-labelledby="t d" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title id="t">Time to answer 50 questions about one document</title>
<desc id="d">Median seconds for five systems on one box, on a linear axis from zero, for documents of 3,000 and 6,000 tokens, and which systems answer at 32,000 tokens; the table in the report has every value.</desc>
<rect width="1240" height="1120" fill="#1a1a19"/>
<text x="28" y="40" font-size="22" font-weight="600" fill="#ffffff">Time to answer 50 questions about one document</text>
<text x="28" y="64" font-size="13" fill="#c3c2b7">Median seconds over 5 to 10 documents; a linear axis from zero. Five systems measured in one session on one box, each on its own server; fastest first.</text>
<rect x="28" y="88" width="12" height="12" rx="2" fill="#3987e5"/>
<text x="48" y="98" font-size="13" fill="#ffffff">One request: document read once for all questions</text>
<rect x="436" y="88" width="12" height="12" rx="2" fill="#d95926"/>
<text x="456" y="98" font-size="13" fill="#ffffff">One request: document read again for every question</text>
<rect x="28" y="110" width="12" height="12" rx="2" fill="#199e70"/>
<text x="48" y="120" font-size="13" fill="#ffffff">One request per question: document shared by the prefix cache</text>
<text x="28" y="150" font-size="15" font-weight="600" fill="#ffffff">A document of 3,000 tokens</text>
<line x1="250.0" y1="166" x2="250.0" y2="346" stroke="#2e2e2c" stroke-width="1"/>
<text x="250.0" y="364" font-size="11" text-anchor="middle" fill="#8f8e86">0 s</text>
<line x1="386.7" y1="166" x2="386.7" y2="346" stroke="#2e2e2c" stroke-width="1"/>
<text x="386.7" y="364" font-size="11" text-anchor="middle" fill="#8f8e86">10 s</text>
<line x1="523.3" y1="166" x2="523.3" y2="346" stroke="#2e2e2c" stroke-width="1"/>
<text x="523.3" y="364" font-size="11" text-anchor="middle" fill="#8f8e86">20 s</text>
<line x1="660.0" y1="166" x2="660.0" y2="346" stroke="#2e2e2c" stroke-width="1"/>
<text x="660.0" y="364" font-size="11" text-anchor="middle" fill="#8f8e86">30 s</text>
<line x1="796.7" y1="166" x2="796.7" y2="346" stroke="#2e2e2c" stroke-width="1"/>
<text x="796.7" y="364" font-size="11" text-anchor="middle" fill="#8f8e86">40 s</text>
<line x1="933.3" y1="166" x2="933.3" y2="346" stroke="#2e2e2c" stroke-width="1"/>
<text x="933.3" y="364" font-size="11" text-anchor="middle" fill="#8f8e86">50 s</text>
<line x1="1070.0" y1="166" x2="1070.0" y2="346" stroke="#2e2e2c" stroke-width="1"/>
<text x="1070.0" y="364" font-size="11" text-anchor="middle" fill="#8f8e86">60 s</text>
<line x1="250" y1="166" x2="250" y2="346" stroke="#4a4a47" stroke-width="1"/>
<text x="228" y="188.0" font-size="13" text-anchor="end" fill="#ffffff">decisio Gemma 4 31B</text>
<g><title>decisio Gemma 4 31B: 1.08 s for 50 questions about one 3,000-token document (median of 10 documents)</title><rect x="250" y="174.0" width="14.8" height="20" rx="2" fill="#3987e5"/></g>
<text x="272.8" y="188.0" font-size="13" font-weight="600" fill="#ffffff">1.08 s</text>
<text x="228" y="224.0" font-size="13" text-anchor="end" fill="#ffffff">decisio Gemma 4 12B</text>
<g><title>decisio Gemma 4 12B: 1.57 s for 50 questions about one 3,000-token document (median of 10 documents)</title><rect x="250" y="210.0" width="21.4" height="20" rx="2" fill="#3987e5"/></g>
<text x="279.4" y="224.0" font-size="13" font-weight="600" fill="#ffffff">1.57 s</text>
<text x="228" y="260.0" font-size="13" text-anchor="end" fill="#ffffff">H2O-Lightning-4B v1.1</text>
<g><title>H2O-Lightning-4B v1.1: 2.05 s for 50 questions about one 3,000-token document (median of 10 documents)</title><rect x="250" y="246.0" width="28.0" height="20" rx="2" fill="#199e70"/></g>
<text x="286.0" y="260.0" font-size="13" font-weight="600" fill="#ffffff">2.05 s</text>
<text x="228" y="296.0" font-size="13" text-anchor="end" fill="#ffffff">Jeff-1.0-Large</text>
<g><title>Jeff-1.0-Large: 47.1 s for 50 questions about one 3,000-token document (median of 5 documents)</title><rect x="250" y="282.0" width="643.6" height="20" rx="2" fill="#d95926"/></g>
<text x="901.6" y="296.0" font-size="13" font-weight="600" fill="#ffffff">47.1 s</text>
