name: Feature request
description: Something the server should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do and where the server falls short.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
  - type: textarea
    id: measurement
    attributes:
      label: How we would know it works
      description: Changes to the served path need a measurement; say what you would measure.
