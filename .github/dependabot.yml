version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    # one pull request a week for every patch and minor update together; a major update comes on its own
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    # one pull request a week for every patch and minor update together; a major update comes on its own
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # the plugin targets exactly this vLLM version; bumps are a deliberate, measured change
      - dependency-name: vllm
      # vllm 0.31.0 requires transformers below 5.18.0, and the lock is the environment the cards and the reference
      # checks run in (token rows, chat templates): a transformers bump comes with the vLLM bump, not alone
      - dependency-name: transformers
      # vllm 0.31.0 requires setuptools<81 on Linux, so the Linux branch of uv.lock cannot take a newer one; Dependabot's uv
      # updater then finds no file to change and the job fails on every run (docs/LAUNCH_CHECKLIST.md, flip record)
      - dependency-name: setuptools
      # the next four move with the vLLM bump: vllm 0.31.0 pins torch==2.13.0 and torchvision==0.28.0, holds fastapi
      # below 0.137.0 and caps numpy below 2.4 (through mistral-common[image]>=1.11.6, which needs numpy<2.4), so uv
      # cannot resolve a newer one and the weekly update job failed on them (dependency_file_not_resolvable,
      # 2026-11-04); fastapi and numpy keep their updates inside vLLM's range
      - dependency-name: torch
      - dependency-name: torchvision
      - dependency-name: fastapi
        versions: [">=0.137.0"]
      - dependency-name: numpy
        versions: [">=2.4.0"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(docker)"
    ignore:
      # a vLLM tag bump is a measured change (the plugin targets exactly 0.31.0); only the digest of the pinned tag moves
      - dependency-name: vllm/vllm-openai
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
  - package-ecosystem: npm
    # the pong demo is the only Node project; its lockfile is not part of the wheel or the image
    directory: /examples/demos/pong
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    # one pull request a week for every patch and minor update together; a major update comes on its own
    groups:
      pong-demo:
        patterns: ["*"]
        update-types: [minor, patch]
