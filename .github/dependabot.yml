version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # the plugin targets exactly this vLLM version; bumps are a deliberate, measured change
      - dependency-name: vllm
      # vllm 0.30.0 requires setuptools<81 on Linux, so the Linux branch of uv.lock cannot take a newer one; Dependabot's uv
      # updater then finds no file to change and the job fails on every run (docs/LAUNCH_CHECKLIST.md, flip record)
      - dependency-name: setuptools
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(docker)"
    ignore:
      # a vLLM tag bump is a measured change (the plugin targets exactly 0.30.0); only the digest of the pinned tag moves
      - dependency-name: vllm/vllm-openai
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
