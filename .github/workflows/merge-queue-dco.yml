# The required "DCO" check for the merge queue. The DCO app checks every commit of a pull request and reports on the
# pull request; it does not report on the merge queue's own commits, which GitHub writes (one squash per queued pull
# request) and signs. A pull request enters the queue only with its required checks passed, DCO included, so this
# job reports that for the queue's commit; without it a queued pull request would wait for "DCO" forever.
name: merge queue DCO

on:
  merge_group:

permissions: {}

jobs:
  dco:
    name: DCO
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: The queued pull requests passed DCO before they entered the queue
        env:
          GROUP_SHA: ${{ github.event.merge_group.head_sha }}
        run: echo "merge group $GROUP_SHA; each pull request's commits were checked by the DCO app"
