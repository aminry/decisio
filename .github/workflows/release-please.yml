# Maintains a release pull request from Conventional Commits; merging it tags the release and writes CHANGELOG.md.
# Nobody edits CHANGELOG.md by hand. Use a GitHub App or fine-grained token in RELEASE_PLEASE_TOKEN so that the
# tag it creates triggers the publish workflow; the default token cannot.
name: release-please

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
