# CPU checks on every pull request and on main. No secrets are used, so pull requests from forks run safely.
# GPU tests (pytest -m gpu) do not run here; see .github/workflows/gpu.yml and CONTRIBUTING.md.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions: {}

env:
  STAND_IN_REVISION: da87bfb608c14b7cf20ba1ce41287e8de496c0cd

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install (locked)
        run: uv sync --extra dev --frozen

      - name: Lint
        run: uv run ruff check .

      # Every file needs a licence: an SPDX header, or an annotation in REUSE.toml (data, logs, run records, CHANGELOG.md).
      - name: REUSE compliance
        run: uvx --from "reuse[charset-normalizer]==6.2.0" reuse lint

      # The website renders README.md, docs/*.md and examples/tasks/README.md and guesses a fence's highlighting
      # when it names no language: every opening fence must name one.
      - name: Code fences name a language
        run: python3 scripts/check_code_fences.py

      # The patch tests apply each series to the tagged vLLM source; without the tree they skip.
      - name: Fetch the vLLM source the patches are checked against
        run: bash scripts/fetch_vllm_source.sh

      # The slow tier (tests that load small models on the CPU) peaks at about 20 GB of RAM in one process and is
      # killed on a 16 GB hosted runner; the nightly workflow (.github/workflows/gpu.yml) runs it one file per process.
      # The task-registration walk-through (tests/unit/test_tasks_walkthrough.py) starts servers on a small stand-in model.
      # It is fetched at this exact revision into a cache, and the test is pointed at the local copy, so a run neither
      # downloads 1.1 GB nor follows a moving branch (other tests fetch small configs from the Hub, so the run is not offline). Change the revision here when the stand-in changes.
      - name: Restore the stand-in model
        id: standin
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/decisio-standin
          key: standin-qwen3-0.6b-base-${{ env.STAND_IN_REVISION }}

      - name: Fetch the stand-in model
        if: steps.standin.outputs.cache-hit != 'true'
        run: uv run hf download Qwen/Qwen3-0.6B-Base --revision "$STAND_IN_REVISION" --local-dir "${{ runner.temp }}/decisio-standin/qwen3-0.6b-base"

      - name: Unit tests (fast tier)
        env:
          DECISIO_STAND_IN_MODEL: ${{ runner.temp }}/decisio-standin/qwen3-0.6b-base
        run: uv run pytest -q --durations=10

      - name: Build the package
        run: uv build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 7
