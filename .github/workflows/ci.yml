# SPDX-FileCopyrightText: Copyright contributors to the decisio project
# CPU checks on every pull request and on main. No secrets are used, so pull requests from forks run safely.
# GPU tests (pytest -m gpu) do not run here; see .github/workflows/gpu.yml and CONTRIBUTING.md.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions: {}

env:
  STAND_IN_REVISION: da87bfb608c14b7cf20ba1ce41287e8de496c0cd

# A newer push to a pull request branch cancels the older run. A run on main is never cancelled: each commit on main
# has its own group, so a release commit's checks always finish (a newer merge used to cancel the older run, and a
# release is only as good as its own CI).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: lint, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install (locked)
        run: uv sync --extra dev --frozen

      - name: Lint
        run: uv run ruff check .

      # Every file needs a licence: an SPDX header, or an annotation in REUSE.toml (data, logs, run records, CHANGELOG.md).
      - name: REUSE compliance
        run: uvx --from "reuse[charset-normalizer]==6.2.0" reuse lint

      # The website renders README.md, docs/*.md and examples/tasks/README.md and guesses a fence's highlighting
      # when it names no language: every opening fence must name one.
      - name: Code fences name a language
        run: python3 scripts/check_code_fences.py

      # A heading that is reworded changes its anchor; every relative link in the rendered documentation must still
      # resolve to a file and a heading.
      - name: Documentation links resolve
        run: python3 scripts/check_doc_anchors.py

      # The patch tests apply each series to the tagged vLLM source; without the tree they skip.
      - name: Fetch the vLLM source the patches are checked against
        run: bash scripts/fetch_vllm_source.sh

      # The slow tier (tests that load small models on the CPU) is not run here: it peaks at about 20 GB of RAM in one
      # process and is killed on a 16 GB hosted runner. The `slow` jobs below run it one file per process.
      # Tests that load the small stand-in model (the task-registration walk-through, tests/unit/test_tasks_walkthrough.py,
      # among them) read it through DECISIO_STAND_IN_MODEL (tests/unit/test_stand_in_env.py). It is fetched at this exact
      # revision into a cache and the variable points at the local copy, so a run neither downloads 1.1 GB, nor follows a
      # moving branch, nor asks the Hub for its files at every load and fails on a rate limit (other tests fetch small
      # configs from the Hub, so the run is not offline). Change the revision here when the stand-in changes.
      - name: Restore the stand-in model
        id: standin
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/decisio-standin
          key: standin-qwen3-0.6b-base-${{ env.STAND_IN_REVISION }}

      - name: Fetch the stand-in model
        if: steps.standin.outputs.cache-hit != 'true'
        run: uv run hf download Qwen/Qwen3-0.6B-Base --revision "$STAND_IN_REVISION" --local-dir "${{ runner.temp }}/decisio-standin/qwen3-0.6b-base"

      - name: Unit tests (fast tier)
        env:
          DECISIO_STAND_IN_MODEL: ${{ runner.temp }}/decisio-standin/qwen3-0.6b-base
        run: uv run pytest -q --durations=10

      - name: Build the package
        run: uv build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 7

  # The shared task store on a real S3-compatible service: the two-replica tests of the task store
  # (tests/unit/test_task_store_shared.py, S10) and of the fast table that learns across replicas
  # (tests/unit/test_fast_table_replicas.py, R11), which skip unless DECISIO_TEST_S3_ENDPOINT names a service.
  # MinIO stopped publishing community images in 2025: Docker Hub's minio/minio and quay.io's ask for credentials.
  # Chainguard builds MinIO from its source and publishes the image anonymously; it is pinned here by digest (older
  # digests stay pullable). It is started with `docker run` and not as a service container because the image needs the
  # `server <dir>` arguments, which a service container cannot pass. The credentials are throwaway values for this
  # local server, not secrets.
  s3:
    name: shared task store on MinIO
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      MINIO_IMAGE: cgr.dev/chainguard/minio@sha256:cee9a8e35885e93f14b3cb32960e5017aff74e2adfb52ba87c65003b0163886b
      DECISIO_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      DECISIO_TEST_S3_BUCKET: decisio-test
      AWS_ACCESS_KEY_ID: decisio-ci
      AWS_SECRET_ACCESS_KEY: decisio-ci-secret
      AWS_REGION: us-east-1
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Start MinIO
        run: |
          docker run -d --name minio -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER="$AWS_ACCESS_KEY_ID" -e MINIO_ROOT_PASSWORD="$AWS_SECRET_ACCESS_KEY" \
            --tmpfs /data:rw,mode=1777 "$MINIO_IMAGE" server /data --address :9000
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:9000/minio/health/live && break
            sleep 1
          done
          curl -sf http://127.0.0.1:9000/minio/health/live

      # The runner image has the AWS CLI.
      - name: Create the bucket
        run: aws --endpoint-url "$DECISIO_TEST_S3_ENDPOINT" s3api create-bucket --bucket "$DECISIO_TEST_S3_BUCKET"

      - name: Install (locked)
        run: uv sync --extra dev --frozen

      # Both tests must run: a skip (a missing dependency, an unset variable) fails the job.
      - name: The two-replica tests on MinIO
        run: |
          uv run pytest -q -rs -p no:cacheprovider tests/unit/test_task_store_shared.py \
            tests/unit/test_fast_table_replicas.py -k "s10 or r11" | tee pytest.out
          grep -Eq '^2 passed' pytest.out

      - name: MinIO's log
        if: failure()
        run: docker logs minio

  # The slow tier on every pull request that changes code, split over three jobs so that the longest takes about as long
  # as its slowest file (scripts/shard_slow_tier.py). A pull request that changes only documentation skips the work in
  # the first step and still reports success, so the check can be required.
  slow:
    name: slow CPU tier (shard ${{ matrix.shard }} of 3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      # A pull request is checked out as its merge with the base: HEAD^1 is the base, so the diff is the pull request's.
      # Anything else (a push to main, a merge group) always runs.
      - name: Does this change code?
        id: scope
        run: |
          run=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if git diff --name-only HEAD^1 HEAD | grep -Eq '^(src/|tests/|scripts/|pyproject\.toml$|uv\.lock$|\.github/workflows/ci\.yml$)'; then
              echo "code or CI changed: the slow tier runs"
            else
              run=false
              echo "documentation or other files only: the slow tier is skipped"
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: steps.scope.outputs.run == 'true'
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install (locked)
        if: steps.scope.outputs.run == 'true'
        run: uv sync --extra dev --frozen

      # The same stand-in model and cache key as the `checks` job above.
      - name: Restore the stand-in model
        if: steps.scope.outputs.run == 'true'
        id: standin
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/decisio-standin
          key: standin-qwen3-0.6b-base-${{ env.STAND_IN_REVISION }}

      - name: Fetch the stand-in model
        if: steps.scope.outputs.run == 'true' && steps.standin.outputs.cache-hit != 'true'
        run: uv run hf download Qwen/Qwen3-0.6B-Base --revision "$STAND_IN_REVISION" --local-dir "${{ runner.temp }}/decisio-standin/qwen3-0.6b-base"

      # One process per file, as the nightly workflow (.github/workflows/gpu.yml) does: the largest, tests/unit/test_image_route.py,
      # peaks at about 11 GB; the whole tier in one process kept every file's models loaded, about 20 GB, more than a
      # 16 GB hosted runner has. Each file's seconds go to the job summary, where the weights of
      # scripts/shard_slow_tier.py are refreshed from.
      - name: Slow CPU tier, one file per process
        if: steps.scope.outputs.run == 'true'
        env:
          DECISIO_STAND_IN_MODEL: ${{ runner.temp }}/decisio-standin/qwen3-0.6b-base
          SHARD: ${{ matrix.shard }}
        run: |
          all=$(uv run pytest --collect-only -q -m slow | grep "::" | cut -d: -f1 | sort -u)
          test -n "$all" || { echo "no slow tests collected"; exit 1; }
          files=$(echo "$all" | python3 scripts/shard_slow_tier.py 3 "$SHARD")
          echo "shard $SHARD: $(paste -sd ' ' - <<< "$files")"
          rc=0
          echo "| file | seconds |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | ---: |" >> "$GITHUB_STEP_SUMMARY"
          for f in $files; do
            echo "::group::$f"
            start=$SECONDS
            uv run pytest -q -m slow "$f" || rc=1
            echo "| $f | $((SECONDS - start)) |" >> "$GITHUB_STEP_SUMMARY"
            echo "::endgroup::"
          done
          exit $rc

  # One check to require, whatever the number of shards.
  slow-tier:
    name: slow CPU tier
    needs: slow
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: The shards passed
        env:
          RESULT: ${{ needs.slow.result }}
        run: |
          echo "shards: $RESULT"
          test "$RESULT" = success
