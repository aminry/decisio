# CPU checks on every pull request and on main. No secrets are used, so pull requests from forks run safely.
# GPU tests (pytest -m gpu) do not run here; see .github/workflows/gpu.yml and CONTRIBUTING.md.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install (locked)
        run: uv sync --extra dev --frozen

      - name: Lint
        run: uv run ruff check .

      # The patch tests apply each series to the tagged vLLM source; without the tree they skip.
      - name: Fetch the vLLM source the patches are checked against
        run: bash scripts/fetch_vllm_source.sh

      # The slow tier (tests that load small models on the CPU) peaks at about 20 GB of RAM and is killed on
      # a 16 GB hosted runner; it runs in the nightly job (.github/workflows/gpu.yml) and locally with -m slow.
      - name: Unit tests (fast tier)
        run: uv run pytest -q

      - name: Build the package
        run: uv build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 7
