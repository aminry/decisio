# The nightly tier. On a hosted runner, no card needed: the slow CPU tier and the engine-death tests looped under load.
# On a trusted self-hosted runner with a card: the GPU tests, skipped until one is registered (none is yet).
# Never triggered by a pull request: fork code must not reach a self-hosted card.
# Runs nightly on main, and on demand: dispatched on main, or on a branch a maintainer has already reviewed, which then
# runs in that branch's own context (its caches stay the branch's). There is no input naming another ref: checking one
# out in the default branch's context would let it write the caches the default branch restores.
# The runner is registered with the label "gpu" and must be ephemeral (one job, then re-registered).
name: gpu

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

env:
  STAND_IN_REVISION: da87bfb608c14b7cf20ba1ce41287e8de496c0cd  # as ci.yml

jobs:
  cpu-nightly:
    name: slow tier and engine-death loop (no card)
    # A hosted runner: the slow tier's small models and the engine-death tests' CPU stand-in need no card.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"

      - name: Install (locked)
        run: uv sync --extra dev --frozen

      # Restore only: this job checks out a ref a maintainer names, so it must not write a cache the default branch
      # restores (CodeQL actions/cache-poisoning); ci.yml's runs on main keep the stand-in cached.
      - name: Restore the stand-in model
        id: standin
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/decisio-standin
          key: standin-qwen3-0.6b-base-${{ env.STAND_IN_REVISION }}

      - name: Fetch the stand-in model
        if: steps.standin.outputs.cache-hit != 'true'
        run: uv run hf download Qwen/Qwen3-0.6B-Base --revision "$STAND_IN_REVISION" --local-dir "${{ runner.temp }}/decisio-standin/qwen3-0.6b-base"

      # One process per file: the largest, tests/unit/test_image_route.py, peaks at about 11 GB; the whole tier in one
      # process kept every file's models loaded, about 20 GB, more than a 16 GB hosted runner has.
      - name: Slow CPU tier, one file per process
        env:
          DECISIO_STAND_IN_MODEL: ${{ runner.temp }}/decisio-standin/qwen3-0.6b-base
        run: |
          files=$(uv run pytest --collect-only -q -m slow | grep "::" | cut -d: -f1 | sort -u)
          test -n "$files" || { echo "no slow tests collected"; exit 1; }
          rc=0
          for f in $files; do
            echo "::group::$f"
            uv run pytest -q -m slow "$f" || rc=1
            echo "::endgroup::"
          done
          exit $rc

      # The engine-death tests start real servers and kill engine processes, so their timing races show only under
      # load: 30 runs beside a busy loop on every core, so a new race shows here rather than in a rented card's set-up.
      - name: The engine-death tests, 30 runs, 2 at a time, beside a busy loop on every core
        if: always()
        env:
          DECISIO_STAND_IN_MODEL: ${{ runner.temp }}/decisio-standin/qwen3-0.6b-base
        run: bash scripts/engine_death_loop.sh 30 2 engine-death-loop

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: engine-death-loop
          path: engine-death-loop/
          retention-days: 14

  gpu-tests:
    name: serving gates and model classes
    # Skipped until a runner labelled "gpu" is registered and the repository variable GPU_RUNNER_READY is set to
    # "true"; without a runner a queued job waits 24 hours and then fails, every night.
    if: vars.GPU_RUNNER_READY == 'true'
    runs-on: [self-hosted, gpu]
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      DECISIO_MODEL: ${{ vars.DECISIO_MODEL }}
      DECISIO_VIEW: ${{ vars.DECISIO_VIEW }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"

      - name: Install with the serve extra (locked)
        run: uv sync --extra serve --extra dev --frozen

      # A GPU test skips when its checkpoint variable is unset, which would turn this job green without running the
      # serving gates; fail instead.
      - name: Both checkpoint variables are set
        run: |
          test -n "$DECISIO_MODEL" || { echo "repository variable DECISIO_MODEL is not set"; exit 1; }
          test -n "$DECISIO_VIEW" || { echo "repository variable DECISIO_VIEW is not set"; exit 1; }

      - name: GPU tests
        run: uv run pytest -m gpu -q

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: gpu-test-output
          path: |
            tests/gpu/output/
          if-no-files-found: ignore
          retention-days: 14
