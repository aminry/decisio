# Turns on auto-merge (squash) for a Dependabot pull request whose every update is a patch or minor version, so it
# merges by itself once the required checks pass (through the merge queue when it is on). Majors stay for a person, and
# so do the dependencies decisio pins on purpose (vllm, transformers, setuptools, the vLLM image: also ignored in
# dependabot.yml) and every Docker update.
# pull_request_target, not pull_request: a Dependabot pull_request run gets a read-only token. The job never checks out
# or runs the pull request's code; it reads Dependabot's metadata and calls `gh pr merge --auto`.
name: dependabot auto-merge

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] -- no checkout of the pull request; metadata and gh only
    types: [opened, reopened, synchronize]

permissions: {}

jobs:
  automerge:
    name: auto-merge patch and minor updates
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'aminry/decisio'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Read Dependabot's metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ github.token }}

      - name: Decide
        id: decide
        env:
          DEPS: ${{ steps.meta.outputs.updated-dependencies-json }}
          ECOSYSTEM: ${{ steps.meta.outputs.package-ecosystem }}
        run: |
          # every dependency must be a patch or minor update and none may be one decisio pins on purpose
          ok=$(jq -r --arg eco "$ECOSYSTEM" '
            ($eco != "docker") and (length > 0) and all(.[];
              (.updateType == "version-update:semver-patch" or .updateType == "version-update:semver-minor")
              and ((.dependencyName | ascii_downcase) as $n
                   | ["vllm", "transformers", "setuptools", "vllm/vllm-openai"] | index($n) | not))' <<< "$DEPS")
          echo "auto=$ok" >> "$GITHUB_OUTPUT"
          jq -r '.[] | "\(.dependencyName) \(.prevVersion) -> \(.newVersion) (\(.updateType))"' <<< "$DEPS"
          echo "ecosystem $ECOSYSTEM; auto-merge: $ok"

      - name: Turn on auto-merge
        if: steps.decide.outputs.auto == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR"
