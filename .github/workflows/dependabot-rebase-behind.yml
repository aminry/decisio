# Keeps auto-merging Dependabot pull requests moving while main requires branches to be up to date: after a push to
# main, the oldest open Dependabot pull request that has auto-merge on and is behind main is brought up to date with
# GitHub's "Update branch" (main merged into it), as the repository's GitHub App, so its checks run on top of main and
# auto-merge merges it. One pull request at a time: its own merge is the next push.
# Not `@dependabot rebase`: Dependabot obeys that comment only from a user with push access, never from an App, and
# refused it silently from this workflow ("only users with push access can use that command").
# The cost of "Update branch": a commit that is not Dependabot's, so Dependabot stops rebasing or recreating that pull
# request (its auto-merge stays on, and this workflow keeps it up to date). The auto-merge workflow skips the App's
# update (its sender is not Dependabot), so it does not read Dependabot's metadata from a commit that is not Dependabot's.
# A refused or failed update fails the run.
# workflow_dispatch with `pr` updates that pull request only.
name: dependabot rebase behind

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr:
        description: "a Dependabot pull request number to bring up to date (empty: the oldest behind one)"
        required: false

permissions: {}

concurrency:
  group: dependabot-rebase-behind
  cancel-in-progress: false

jobs:
  rebase:
    name: bring the oldest behind Dependabot pull request up to date
    if: github.repository == 'aminry/decisio'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: A token of the App
        id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.AUTOMERGE_APP_CLIENT_ID || secrets.AUTOMERGE_APP_ID }}
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}
          # updating a branch writes a merge commit to it, and main's changes may touch workflows
          permission-pull-requests: write
          permission-contents: write
          permission-workflows: write

      - name: Pick and update
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          ONLY: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          if [ -n "${ONLY:-}" ]; then
            case "$ONLY" in *[!0-9]*) echo "::error::pr must be a number"; exit 1;; esac
            candidates="$ONLY"
          else
            # open Dependabot pull requests, oldest first, with auto-merge on
            candidates=$(gh pr list --repo "$REPO" --author app/dependabot --state open --limit 100 \
              --json number,createdAt,autoMergeRequest \
              --jq 'sort_by(.createdAt) | .[] | select(.autoMergeRequest != null) | .number')
          fi
          for n in $candidates; do
            pr=$(gh api "repos/$REPO/pulls/$n")
            [ "$(jq -r .user.login <<< "$pr")" = "dependabot[bot]" ] || { echo "#$n is not Dependabot's: skipped"; continue; }
            head=$(jq -r .head.sha <<< "$pr")
            behind=$(gh api "repos/$REPO/compare/$head...main" --jq .ahead_by)
            [ "$behind" -gt 0 ] || { echo "#$n is up to date"; continue; }
            # a conflict is Dependabot's to resolve (it rebases a conflicting pull request by itself while no other
            # commit is on it); "Update branch" cannot merge it
            if [ "$(jq -r .mergeable_state <<< "$pr")" = "dirty" ]; then
              echo "::warning::#$n conflicts with main: left to Dependabot"
              continue
            fi
            # GitHub answers 202 and merges main into the branch; a 422 (a conflict, or a head that moved) fails the run
            gh api -X PUT "repos/$REPO/pulls/$n/update-branch" -f expected_head_sha="$head" > /dev/null
            for _ in $(seq 1 30); do
              now=$(gh api "repos/$REPO/pulls/$n" --jq .head.sha)
              [ "$now" != "$head" ] && break
              sleep 4
            done
            if [ "$now" = "$head" ]; then
              echo "::error::#$n: update-branch was accepted but the head did not move in 2 minutes"
              exit 1
            fi
            echo "#$n was $behind behind main: updated, head ${head:0:7} -> ${now:0:7}"
            break
          done
