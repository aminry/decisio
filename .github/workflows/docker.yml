# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: Copyright contributors to the decisio project
# The server image (Dockerfile).
#   Pull requests: build for linux/amd64 without pushing, with and without the optional patch series, and check that the
#   container fails clearly when no GPU is visible. No secrets, a read-only token.
#   Release tags: build, push to ghcr.io/aminry/decisio (version tag and digest), attest provenance and an SBOM, and
#   write the digest into the release notes. Gated off while the repository is private, like the other release jobs.
# The tag is made by release-please with the release app's token (docs/LAUNCH_CHECKLIST.md, 2.6), because a tag made with
# the default token would not start this workflow.
name: docker

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - compose.yaml
      - docker/**
      - patches/**
      - src/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/docker.yml
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions: {}

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/aminry/decisio

jobs:
  build:
    name: build, no push
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The base image is about 9 GB compressed and about 25 GB unpacked, and Docker keeps both: it does not fit on the
      # runner's 72 GB root volume next to the toolchains the runner image ships with (/mnt is the same volume). This job
      # needs none of them.
      - name: Free disk space
        run: |
          df -h /
          sudo swapoff -a || true
          sudo rm -rf /mnt/swapfile /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /opt/microsoft \
            /opt/az /usr/local/.ghcup /usr/share/swift /usr/lib/jvm /usr/local/share/boost /usr/local/share/powershell \
            /usr/local/julia* /usr/share/miniconda /usr/lib/google-cloud-sdk /usr/local/lib/node_modules \
            /usr/local/share/chromium /usr/lib/firefox
          docker image prune --all --force > /dev/null
          df -h /

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"

      - name: Build the wheel the image installs
        run: uv build --wheel

      # The docker driver builds straight into the daemon's image store: the docker-container driver keeps its own copy of
      # the layers and would need a second one to load the image, which does not fit on the runner with a 20 GB base.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker

      - name: Build the image (linux/amd64, not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: decisio:ci
          build-args: APPLY_PATCHES=0

      - name: The container fails clearly when no GPU is visible
        run: |
          set +e
          out=$(docker run --rm --platform linux/amd64 decisio:ci 2>&1)
          code=$?
          set -e
          echo "$out"
          test "$code" -eq 1
          echo "$out" | grep -q "no NVIDIA GPU is visible"
          ! echo "$out" | grep -q "Traceback"

      - name: The image runs as a non-root user and declares a health check
        run: |
          test "$(docker image inspect decisio:ci --format '{{.Config.User}}')" = "decisio"
          test -n "$(docker image inspect decisio:ci --format '{{if .Config.Healthcheck}}yes{{end}}')"

      # The fast-table variant (docker/Dockerfile.table) on top of the image just built: the add-on and the static students,
      # then a static and a multilingual fast-table task registered and served with the network off.
      - name: Build the fast-table variant (linux/amd64, not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.table
          platforms: linux/amd64
          push: false
          tags: decisio:ci-table
          build-args: BASE=decisio:ci

      - name: The variant fits and serves static fast tables with no network
        run: |
          docker run --rm --network none -e HF_HUB_OFFLINE=1 -v "$PWD/docker:/check:ro" --entrypoint python3 \
            decisio:ci-table /check/check_table_offline.py

      - name: The release image is unchanged, and the variant is it plus layers
        run: |
          # the release image has neither the add-on nor the students
          docker run --rm --entrypoint python3 decisio:ci -c "import importlib.util as u, os; \
            assert u.find_spec('sklearn') is None and u.find_spec('onnxruntime') is None; \
            assert not os.path.exists('/opt/decisio/students') and 'DECISIO_STUDENTS_DIR' not in os.environ"
          base=$(docker image inspect decisio:ci --format '{{json .RootFS.Layers}}')
          table=$(docker image inspect decisio:ci-table --format '{{json .RootFS.Layers}}')
          python3 -c "import json, sys; b, t = json.loads(sys.argv[1]), json.loads(sys.argv[2]); assert t[: len(b)] == b and len(t) > len(b), 'the variant does not start with the release image layers'" "$base" "$table"
          test "$(docker image inspect decisio:ci-table --format '{{.Config.User}}')" = "decisio"
          test "$(docker image inspect decisio:ci-table --format '{{json .Config.Entrypoint}}')" = "$(docker image inspect decisio:ci --format '{{json .Config.Entrypoint}}')"
          b=$(docker image inspect decisio:ci --format '{{.Size}}'); t=$(docker image inspect decisio:ci-table --format '{{.Size}}')
          {
            echo "| image | size |"
            echo "| --- | ---: |"
            echo "| release | $((b / 1000000)) MB |"
            echo "| fast-table variant | $((t / 1000000)) MB (+$(((t - b) / 1000000)) MB) |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          docker run --rm --entrypoint cat decisio:ci-table /opt/decisio/students/MANIFEST.json

      - name: Build the image with the optional patch series
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: decisio:ci-patched
          build-args: APPLY_PATCHES=1

  image:
    name: build and push
    if: github.event_name == 'push' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      digest_table: ${{ steps.push_table.outputs.digest }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The base image is about 9 GB compressed and about 25 GB unpacked, and Docker keeps both: it does not fit on the
      # runner's 72 GB root volume next to the toolchains the runner image ships with (/mnt is the same volume). This job
      # needs none of them.
      - name: Free disk space
        run: |
          df -h /
          sudo swapoff -a || true
          sudo rm -rf /mnt/swapfile /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /opt/microsoft \
            /opt/az /usr/local/.ghcup /usr/share/swift /usr/lib/jvm /usr/local/share/boost /usr/local/share/powershell \
            /usr/local/julia* /usr/share/miniconda /usr/lib/google-cloud-sdk /usr/local/lib/node_modules \
            /usr/local/share/chromium /usr/lib/firefox
          docker image prune --all --force > /dev/null
          df -h /

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"

      - name: The tag matches the package version
        id: version
        run: |
          version=$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "v${version}" = "${GITHUB_REF_NAME}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build the wheel the image installs
        run: uv build --wheel

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          build-args: APPLY_PATCHES=0
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          # the image is attested below (GitHub attestations), so the manifest stays a plain image manifest
          provenance: false
          sbom: false

      # The fast-table variant (docker/Dockerfile.table): the image just pushed, by its digest, plus the add-on and the
      # static students; its own tag, digest and attestations
      - name: Build and push the fast-table variant
        id: push_table
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.table
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }}-table
          build-args: BASE=${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}-table
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: false
          sbom: false

  attest:
    name: attest provenance and SBOM (${{ matrix.variant }})
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # the release image and its fast-table variant, each on its own runner (each scan unpacks a 9 GB image)
    strategy:
      fail-fast: false
      matrix:
        variant: [release, table]
    env:
      DIGEST: ${{ matrix.variant == 'table' && needs.image.outputs.digest_table || needs.image.outputs.digest }}
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: write
    steps:
      # syft saves the 9 GB (25 GB unpacked) image under /tmp on the runner; v0.21.0's two attempts ran out of disk
      # ("disk quota exceeded") on the runner image as it now ships, where v0.20.0's had not. Free what this job does not need.
      - name: Free disk space
        run: |
          df -h /
          sudo swapoff -a || true
          sudo rm -rf /mnt/swapfile /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/microsoft /opt/az /usr/local/.ghcup \
            /usr/share/swift /usr/lib/jvm /usr/local/share/boost /usr/local/share/powershell /usr/local/julia* \
            /usr/share/miniconda /usr/lib/google-cloud-sdk /usr/local/lib/node_modules /usr/local/share/chromium /usr/lib/firefox
          docker image prune --all --force > /dev/null
          df -h /

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # syft unpacks the image under TMPDIR, and /tmp on the runner is an 8 GB tmpfs: the 9 GB image does not fit there
      # ("disk quota exceeded" with 120 GB free on the root volume; found by scanning the 0.21.1 image on a pull request
      # with and without TMPDIR moved). The runner's own temp directory is on the root volume. The disk-space step above
      # is kept: the scan that passed had run it.
      - name: Generate the SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        env:
          TMPDIR: ${{ runner.temp }}
        with:
          image: ${{ env.IMAGE }}@${{ env.DIGEST }}
          # CycloneDX, not SPDX: the SPDX document of this 9 GB image is 49 MB and attest-sbom accepts 16 MiB (measured with
          # syft on the 0.1.0 image: SPDX 49 MB, CycloneDX 8.4 MB)
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: The SBOM fits the attestation action's limit
        run: |
          size=$(wc -c < sbom.cdx.json)
          echo "SBOM: ${size} bytes (limit 16777216)"
          test "$size" -lt 16777216

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true

      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          sbom-path: sbom.cdx.json
          push-to-registry: true

  release-notes:
    name: digest in the release notes
    needs: [image, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      DIGEST: ${{ needs.image.outputs.digest }}
      DIGEST_TABLE: ${{ needs.image.outputs.digest_table }}
      VERSION: ${{ needs.image.outputs.version }}
    steps:
      - name: Append the image to the release notes
        run: |
          for _ in $(seq 1 30); do gh release view "$TAG" > /dev/null 2>&1 && break; sleep 10; done
          body=$(gh release view "$TAG" --json body --jq .body)
          case "$body" in *"${IMAGE}@"*) echo "already recorded"; exit 0 ;; esac
          # the backticks below are Markdown, not command substitution
          # shellcheck disable=SC2016
          {
            printf '%s\n\n### Container image\n\n' "$body"
            printf '`%s:%s`\n\n`%s@%s`\n\n' "$IMAGE" "$VERSION" "$IMAGE" "$DIGEST"
            printf 'Verify: `gh attestation verify oci://%s@%s --repo %s`\n' "$IMAGE" "$DIGEST" "$GH_REPO"
            printf '\nWith the fast-table add-on and its static students built in, for fast tables with no Hub access (docs/running.md, "The fast-table image"):\n\n'
            printf '`%s:%s-table`\n\n`%s@%s`\n\n' "$IMAGE" "$VERSION" "$IMAGE" "$DIGEST_TABLE"
            printf 'Verify: `gh attestation verify oci://%s@%s --repo %s`\n' "$IMAGE" "$DIGEST_TABLE" "$GH_REPO"
          } | gh release edit "$TAG" --notes-file -
