# uvx pre-commit install --hook-type pre-commit --hook-type commit-msg
# Verbatim files: patches apply byte for byte, the records under runs/ and tests/data/ are hashed (files.json), the
# code of conduct is Contributor Covenant 3.0 as published, and the three demo clients are vendored from other projects
# in their own style (examples/demos/<name>/ATTRIBUTION.md).
exclude: ^(patches/|runs/|tests/data/|CODE_OF_CONDUCT\.md$|examples/demos/(fsd|ultrafast|pong)/)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
        args: ["--maxkb=20000"]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-yaml
      - id: check-json
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, docs, test, chore, refactor, perf, ci, build]
