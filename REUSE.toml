# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: Copyright contributors to the decisio project
# Licence annotations for the files that cannot carry an SPDX header (JSON, CSV, binary data, patches, the lock file,
# CHANGELOG.md, which release-please generates and nobody edits) and for every record under runs/, whatever its
# extension (logs, hashes, scripts, summaries). The licence texts are in LICENSES/; LICENSE is the Apache text too.
version = 1

[[annotations]]
path = ["**/*.json", "**/*.jsonl", "**/*.csv", "**/*.gz", "**/*.npz", "**/*.patch", "runs/**", "uv.lock", "NOTICE", "CHANGELOG.md"]
precedence = "aggregate"
SPDX-FileCopyrightText = "Copyright contributors to the decisio project"
SPDX-License-Identifier = "Apache-2.0"

# The three demo clients are vendored from other projects under their own licences (examples/demos/<name>/ATTRIBUTION.md).
# Changes made here stay under the licence of the file they change. Later annotations win over earlier ones.
[[annotations]]
path = ["examples/demos/fsd/**"]
precedence = "override"
SPDX-FileCopyrightText = "Copyright (c) 2026 Brendan Hallas"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["examples/demos/fsd/static/vendor/three/**"]
precedence = "override"
SPDX-FileCopyrightText = "Copyright three.js authors"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["examples/demos/fsd/data/maps/**"]
precedence = "override"
SPDX-FileCopyrightText = "OpenStreetMap contributors"
SPDX-License-Identifier = "ODbL-1.0"

[[annotations]]
path = ["examples/demos/ultrafast/**"]
precedence = "override"
SPDX-FileCopyrightText = "Copyright (c) 2026 Browser Use"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["examples/demos/pong/**"]
precedence = "override"
SPDX-FileCopyrightText = "Copyright 2026 Ably Real-time Ltd"
SPDX-License-Identifier = "Apache-2.0"
