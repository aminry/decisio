[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "decisio"
version = "0.8.1"
description = "A prefill-only decision server on vLLM: typed questions about a state, a probability distribution per question"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
authors = [{ name = "Amin Roudaki" }]
requires-python = ">=3.12,<3.13"
# The server front, the readout, the tasks and the CPU stand-in; vLLM is the serve extra (Linux, a CUDA card).
# Lower bounds only: uv.lock pins every version, resolved together with the serve extra, so the CPU tests run the
# versions vLLM 0.30.0 runs with (it pins torch 2.13.0, torchvision 0.28.0 and fastapi below 0.137).
# huggingface_hub is imported directly (decisio.serve.hidden_engine) and arrives through transformers; declaring it
# re-resolves uv.lock beyond that one edge (tilelang loses a never-true setuptools marker), so it is left for a
# lock refresh.
dependencies = [
    "fastapi>=0.133",
    "numpy>=2.2",
    "pillow>=11",
    "psutil>=7",
    "pydantic>=2.12",
    "python-multipart>=0.0.20",
    "safetensors>=0.6.2",
    "scipy>=1.15",
    "torch>=2.13",
    "torchvision>=0.28",
    "transformers>=5.10.4",
    "uvicorn>=0.34",
]

[project.optional-dependencies]
# the GPU serving stack; the decisio plugin registers its model classes on exactly this vLLM version
serve = ["vllm==0.30.0; sys_platform == 'linux'"]
# the benchmark stage (benchmarks/): the conformance client and the HTTP drivers; the JevBench harness and the
# Decision Index kit are fetched at pinned commits by benchmarks/fetch_harnesses.sh
bench = ["httpx>=0.28", "typesafe-sdk==0.7.0"]
# httpx2: the client Starlette's TestClient runs on (with httpx alone it warns that httpx is deprecated there)
dev = ["httpx>=0.28", "httpx2>=2.13", "pytest==9.1.1", "ruff==0.14.0"]
# Apple silicon: the MLX engine (decisio.serve.mlx_engine, `--backend mlx`), the text route on a Mac
mlx = [
    "mlx==0.32.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-lm==0.32.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.urls]
Repository = "https://github.com/aminry/decisio"

# vLLM loads this in every process it starts (docs/design/vllm-plugin.md); it registers decisio's model classes on
# vllm==0.30.0 and nothing on any other version
[project.entry-points."vllm.general_plugins"]
decisio = "decisio.vllm_plugin:register"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"decisio.bench" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -m 'not gpu and not slow and not mlx_model'"
# a deprecation in the web framework fails the suite, so the server is never left on an API that is going away
filterwarnings = ["error::starlette.exceptions.StarletteDeprecationWarning"]
markers = [
    "gpu: needs a CUDA card, vLLM 0.30.0 and a local checkpoint (tests/gpu; run with -m gpu)",
    "slow: loads a small Hugging Face model on the CPU",
    "mlx_model: loads an MLX conversion from the local Hugging Face cache (Apple silicon; tests/mlx; run with -m mlx_model)",
]

[tool.ruff]
line-length = 120
target-version = "py312"
# the three demo clients are vendored under their own licences, unchanged in style (examples/demos/*/ATTRIBUTION.md)
extend-exclude = ["examples/demos/fsd", "examples/demos/ultrafast", "examples/demos/pong"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
